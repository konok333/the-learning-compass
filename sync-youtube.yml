name: Sync YouTube Videos
on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1,4"
  push:
    branches: [main]
    paths: ["scripts/sync-youtube.mjs", ".github/workflows/sync-youtube.yml"]
permissions:
  contents: write
concurrency:
  group: youtube-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync public YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_HANDLE: The-Learning-Compass-123
        run: node scripts/sync-youtube.mjs
      - name: Commit JSON updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/playlists.json
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "chore: sync public YouTube videos"; git push; fi
